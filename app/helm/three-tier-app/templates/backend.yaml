apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "three-tier-app.fullname" . }}-backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "three-tier-app.fullname" . }}-backend
  template:
    metadata:
      labels:
        app: {{ include "three-tier-app.fullname" . }}-backend
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.service.port }}
          env:
            - name: DB_HOST
              value: {{ if .Values.postgres.enabled }}{{ include "three-tier-app.fullname" . }}-postgres{{ else }}""{{ end }}
            - name: DB_PORT
              value: {{ .Values.backend.env.dbPort | quote }}
            - name: DB_NAME
              value: {{ .Values.backend.env.dbName | quote }}
            - name: DB_USER
              value: {{ .Values.backend.env.dbUser | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "three-tier-app.fullname" . }}-db
                  key: DB_PASSWORD
            - name: DB_SSLMODE
              value: {{ .Values.backend.env.dbSslMode | quote }}
            - name: PORT
              value: {{ .Values.backend.service.port | quote }}
            - name: CORS_ORIGINS
              value: "*"
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "three-tier-app.fullname" . }}-backend
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    app: {{ include "three-tier-app.fullname" . }}-backend
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.port }}
