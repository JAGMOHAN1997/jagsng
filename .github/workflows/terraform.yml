name: Terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - "main"
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      run_apply:
        description: "Run terraform apply (main branch only)"
        required: false
        default: "false"

env:
  TF_IN_AUTOMATION: "true"

jobs:
  validate:
    name: Fmt and Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform init and validate components
        shell: bash
        run: |
          set -euo pipefail
          for component in terraform/components/*; do
            [ -d "$component" ] || continue
            echo "Validating $component"
            terraform -chdir="$component" init -input=false -backend=false
            terraform -chdir="$component" validate
          done

  plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: validate
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform plan components (if AWS creds are present)
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "Skipping plan because AWS credentials are not configured in repository secrets."
            exit 0
          fi

          for component in terraform/components/*; do
            [ -d "$component" ] || continue
            echo "Planning $component"
            terraform -chdir="$component" init -input=false
            terraform -chdir="$component" plan -input=false -lock=false -no-color
          done

  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.run_apply == 'true'
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform apply components
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "AWS credentials are required for apply."
            exit 1
          fi

          for component in terraform/components/*; do
            [ -d "$component" ] || continue
            echo "Applying $component"
            terraform -chdir="$component" init -input=false
            terraform -chdir="$component" apply -input=false -auto-approve -lock-timeout=300s
          done
